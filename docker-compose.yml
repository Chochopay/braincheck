services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-braincheck}
      POSTGRES_USER: ${DB_USER:-braincheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-braincheck}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-braincheck} -d ${DB_NAME:-braincheck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  staticfiles:
